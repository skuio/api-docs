# Canonical tags for Release Notes posts.
# `onInlineTags: throw` in docusaurus.config.ts means every tag used in a
# post's front matter MUST be defined here — keeps the tag set consistent
# and filterable. Three dimensions: kind + change type + product area.

# ── Kind ─────────────────────────────────────────────────────────────
# Exactly one per post. Drives the Major / Minor / Fixes toggle.
major-feature:
  label: Major Feature
  permalink: /major-feature
  description: A headline release — a significant new capability.

minor-feature:
  label: Minor Feature
  permalink: /minor-feature
  description: A smaller standalone feature or enhancement.

roundup:
  label: Fixes & Improvements
  permalink: /roundup
  description: Weekly roundup of bug fixes and minor improvements.

# ── Change type ──────────────────────────────────────────────────────
new:
  label: New
  permalink: /new
  description: Brand-new features and capabilities.

improved:
  label: Improved
  permalink: /improved
  description: Enhancements to existing features.

fixed:
  label: Fixed
  permalink: /fixed
  description: Notable bug fixes.

breaking:
  label: Breaking change
  permalink: /breaking
  description: Changes that may require action — review before your next workflow.

deprecated:
  label: Deprecated
  permalink: /deprecated
  description: Features being phased out.

# ── Product area ─────────────────────────────────────────────────────
orders:
  label: Orders
  permalink: /orders
  description: Sales orders, credits, returns, and RMAs.

inventory:
  label: Inventory
  permalink: /inventory
  description: Products, stock, assemblies, and costing.

purchasing:
  label: Purchasing
  permalink: /purchasing
  description: Purchase orders, suppliers, and inbound shipments.

fulfillment:
  label: Fulfillment
  permalink: /fulfillment
  description: Picking, packing, and order fulfillment.

shipping:
  label: Shipping
  permalink: /shipping
  description: Shipping providers and label generation.

integrations:
  label: Integrations
  permalink: /integrations
  description: Sales channels — Amazon, Shopify, eBay, and more.

accounting:
  label: Accounting
  permalink: /accounting
  description: Financials, bills, and accounting integrations.

reporting:
  label: Reporting
  permalink: /reporting
  description: Reports, analytics, and insights.
