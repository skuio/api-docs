# Canonical tags for API Changelog posts.
# `onInlineTags: throw` means every tag must be defined here.
# Changelog entries are generated mechanically from the openapi.yaml diff.

added:
  label: Added
  permalink: /added
  description: New endpoints, parameters, or response fields.

changed:
  label: Changed
  permalink: /changed
  description: Modified endpoints, parameters, or response shapes.

removed:
  label: Removed
  permalink: /removed
  description: Endpoints or fields that no longer exist.

deprecated:
  label: Deprecated
  permalink: /deprecated
  description: Endpoints or fields scheduled for removal.

breaking:
  label: Breaking change
  permalink: /breaking
  description: Changes that may break existing API integrations.
