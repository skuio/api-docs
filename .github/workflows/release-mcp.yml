name: Publish docs MCP to npm

# Publishes @skuio/docs-mcp (the MCP server in mcp/) to the public npm registry
# using npm Trusted Publishing (OIDC) — no stored npm token, no 2FA/passkey.
# GitHub mints a short-lived OIDC token, npm exchanges it for publish auth.
#
# Fires when a tag matching `docs-mcp-v*` is pushed (cut from a commit whose
# mcp/package.json version matches the tag). Also runnable by hand for re-runs.
#
# ── ONE-TIME SETUP on npmjs.com (required before the first run succeeds) ──
# npmjs.com → your avatar → Packages → @skuio/docs-mcp → Settings →
# "Trusted Publisher" → GitHub Actions, with:
#     Organization or user:  skuio
#     Repository:            api-docs
#     Workflow filename:     release-mcp.yml
#     Environment name:      (leave blank)
# Until that trusted publisher exists, `npm publish` below fails with an OIDC
# auth error — that is expected. Add it once, then re-run this workflow.
#
# ── HOW TO CUT A RELEASE afterwards ──
#   1. Bump "version" in mcp/package.json and commit to main.
#   2. Tag that commit:  git tag docs-mcp-v<version> && git push origin docs-mcp-v<version>
#   The tag push triggers this workflow, which verifies the tag matches
#   package.json and publishes with provenance.

on:
  push:
    tags:
      - 'docs-mcp-v*'
  workflow_dispatch:

# id-token: write is what enables the OIDC handshake for Trusted Publishing.
# contents: read is the standard checkout scope.
permissions:
  contents: read
  id-token: write

# Never run two publishes of this package at once.
concurrency:
  group: publish-docs-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      # NOTE: deliberately NO `registry-url:` here. setup-node's registry-url
      # writes an `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line into
      # .npmrc; with Trusted Publishing there is no token, so npm would use that
      # empty token and skip the OIDC exchange → `npm publish` 404s. Leaving it
      # out means npm finds no registry credential and performs the OIDC trusted-
      # publishing handshake instead. Default registry is already npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.x. Pin to the
      # 11.x line — `npm@latest` is now 12.x, which requires Node >= 22.22/24 and
      # fails EBADENGINE on the runner's Node.
      - name: Upgrade npm to a Trusted-Publishing-capable version
        run: npm install -g 'npm@^11.5.1'

      # On a tag push, the tag must match mcp/package.json — stops a stale
      # publish (e.g. tagging docs-mcp-v0.2.0 while package.json still says 0.1.0).
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#docs-mcp-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION but mcp/package.json is $PKG_VERSION"
            exit 1
          fi
          echo "Publishing @skuio/docs-mcp@$PKG_VERSION"

      # No `npm ci` — the package ships only server.mjs + README.md (see "files")
      # with no build/prepare step, so publishing needs no installed dependencies.

      # --provenance records a signed link from the published tarball back to
      # this exact repo + commit + workflow run (public-repo supply-chain attestation).
      - run: npm publish --provenance --access public
