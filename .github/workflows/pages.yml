name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

# Queue deploys instead of cancelling the in-flight one. With ~15-minute
# builds and spec pushes arriving every few minutes during active merge
# windows, cancel-in-progress starved the site indefinitely (2026-07-07:
# four consecutive deploys cancelled each other; the site served a
# hours-old build). GitHub keeps at most one run pending per group and
# replaces it with the newest push, so the latest content still wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # The client webpack compile peaks well above Node's default ~4 GB heap
      # once the site carries a full day of API churn (2026-07-07: two deploys
      # OOM'd at 3.7 GB). ubuntu-latest runners have 7 GB — use it.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx docusaurus gen-api-docs all
      - run: npm run build
      - uses: actions/configure-pages@v4
      - name: Delete stale github-pages artifacts from earlier attempts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of data.artifacts) {
              if (artifact.name === 'github-pages') {
                core.info(`Deleting stale artifact ${artifact.id} (${artifact.name})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
      # Sync the public "SKU.io API" Postman collection (the one the
      # "Run in Postman" badge forks) with this build. Runs LAST — after the
      # site is live — because Postman applies a collection this large as a
      # slow async "deepupdate", and it must never delay the Pages deploy.
      # Non-fatal: if the key is missing or the API errors, the script warns
      # and the deploy still succeeds (see scripts/publish-postman.mjs).
      - name: Sync public Postman collection
        if: always()
        run: node scripts/publish-postman.mjs
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
