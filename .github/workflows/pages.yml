name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

# Queue deploys instead of cancelling the in-flight one. With ~15-minute
# builds and spec pushes arriving every few minutes during active merge
# windows, cancel-in-progress starved the site indefinitely (2026-07-07:
# four consecutive deploys cancelled each other; the site served a
# hours-old build). GitHub keeps at most one run pending per group and
# replaces it with the newest push, so the latest content still wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # The client webpack compile's heap scales with the number of API
      # reference pages, so this ceiling has to be raised as the spec grows:
      #   2026-07-07 — OOM at Node's default ~4 GB (4,700 operations) → 6 GB
      #   2026-07-30 — OOM at 6 GB once the spec crossed 5,071 operations
      #                (peak was ~6.2 GB); six consecutive deploys failed.
      # This repo is public, so its ubuntu-latest runners are the 4-core /
      # 16 GB tier (private repos get 2-core / 8 GB) — the old "runners have
      # 7 GB" note here was wrong. 10 GB leaves ~6 GB for the parallel Terser
      # workers and the OS, and roughly doubles the headroom over today's peak.
      #
      # Raising this ceiling is, for now, the only lever that works. Before the
      # next bump, don't re-try @docusaurus/faster — it was measured on
      # 2026-07-30 and every variant is worse than the Babel/Terser default
      # (clean tree, same 10 GB ceiling, 5,077 operations):
      #   Babel + parallel Terser (current) ...... built OK, peak 8,751 MB
      #   faster, full ........................... OOM at 166s, peak 9,030 MB
      #   faster, no mdxCrossCompilerCache ....... OOM at 283s
      #   faster, no swcJsLoader ................. built, but client compile
      #                                            5.52m vs 2.37m — pure loss
      #   faster + rspackBundler ................. OOM at 348s, peak 10,105 MB
      # swcJsLoader is what tips it over. The premise that SWC would help was
      # wrong twice: Terser already runs in parallel worker *processes*, so it
      # was never on the heap that OOMs, and Rspack's Rust module graph doesn't
      # help either because the memory is held by the JS-side loaders compiling
      # 5,077 MDX pages and resolving their ~15,200 JSON prop sidecars. Any real
      # fix has to cut that per-page loader work, not swap the bundler.
      NODE_OPTIONS: --max-old-space-size=10240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Purges docs/api (except the hand-written introduction.mdx) before
      # regenerating — same as the publisher bot in skuio/sku. gen-api-docs is
      # skip-if-exists per operation, so any leftover .api.mdx suppresses the
      # write of its .json sidecars too; a partially-stale tree then fails the
      # build with "Module not found: ./<op>.ParamsDetails.json". CI checkouts
      # are fresh, but the tracked sidecars mean stale ones can be checked out,
      # and locally this bites every time. Purge-then-generate is unconditional.
      - run: npm run gen:api
      - run: npm run build
      - uses: actions/configure-pages@v4
      - name: Delete stale github-pages artifacts from earlier attempts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of data.artifacts) {
              if (artifact.name === 'github-pages') {
                core.info(`Deleting stale artifact ${artifact.id} (${artifact.name})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
      # The public "SKU.io API" Postman collection is synced by a separate
      # workflow (.github/workflows/postman-sync.yml) that fires on this run's
      # successful completion. It used to be a trailing `if: always()` step
      # here, but the slow (~6-min) Postman deepupdate kept the run alive long
      # enough for a queued newer deploy to supersede it — GitHub cancelled the
      # run mid-PUT and it went red (a green Pages deploy reported as failed).
      # Decoupling it means only the deploy that actually wins syncs Postman,
      # and a superseded build never touches the collection.
